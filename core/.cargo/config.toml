[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --flash-size 16mb --flash-mode dio --flash-freq 80mhz --monitor --baud 460800 --partition-table ./partitions.csv"

[env]
ESP_LOG="info,SpoolEase=trace,esp_hal_app_framework=trace,shared=trace"
ESP_WIFI_CONFIG_RX_QUEUE_SIZE="6"
ESP_WIFI_CONFIG_MAX_BURST_SIZE="12"
ESP_HAL_CONFIG_INSTRUCTION_CACHE_SIZE="32KB"

#for jc8048w550c (ESP_HAL_CONFIG_PLACE_SPI_MASTER_DRIVER_IN_RAM is optional)
# ESP_HAL_CONFIG_PSRAM_MODE="octal"
# ESP_HAL_CONFIG_PLACE_SPI_MASTER_DRIVER_IN_RAM="true"

[build]
rustflags = [
  # "-C", "link-arg=-T./memory.x",
  "-C", "link-arg=-Tlinkall.x",
  "-C", "link-arg=-nostartfiles",
  "--cfg", "getrandom_backend=\"custom\"",
  # "-Z", "stack-protector=all",
]

target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["alloc", "core"]
